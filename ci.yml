Global:
    version: "2.0"
    group_email: fastdeploy@baidu.com
Default:
    profile:
        - fastdeploy
Profiles:
    - profile:
      name: fastdeploy
      mode: AGENT
      environment:
        image: DECK_STD_CENTOS7
        tools:
            - python: 3.9.16
      build:
        command: sh build.sh
      artifacts:
        release: true
      check:
        - enable: false
          reuse: TASK
